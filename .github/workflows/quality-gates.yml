name: SEO and editorial quality gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-quality:
    name: Local content and SEO gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate JavaScript syntax
        run: |
          node --check js/affiliate-tracking.js
          node --check js/babywalz-prices.js
          node --check js/faq-accordion.js
          node --check tools/analytics-contract-gate.mjs
          node --check tools/affiliate-merchant-event-ui-test.mjs
          node --check tools/awin-article-offer-gate.mjs
          node --check tools/affiliate-integrity-check.mjs
          node --check tools/babywalz-feed-health.mjs
          node --check tools/babywalz-price-snapshot-test.mjs
          node --check tools/babywalz-price-ui-test.mjs
          node --check tools/babywalz-product-image-ui-test.mjs
          node --check tools/build-kinderwagen-guides.mjs
          node --check tools/content-brief-gate.mjs
          node --check tools/generate-seal-assets.mjs
          node --check tools/generate-babywalz-price-snapshot.mjs
          node --check tools/internal-link-audit.mjs
          node --check tools/kinderwagen-media-rights-gate.mjs
          node --check tools/kinderwagen-beta-gate.mjs
          node --check tools/kinderwagen-data-freshness-gate.mjs
          node --check tools/kinderwagen-kennzahlen-gate.mjs
          node --check tools/ki-bildkennzeichnung-gate.mjs
          node --check tools/kinderwagen-tracking-contract-gate.mjs
          node --check tools/kpi-dashboard/app.js
          node --check tools/kpi-dashboard/kpi-core.js
          node --check tools/kpi-dashboard/validate.cjs
          node --check tools/prepare-kinderwagen-product-image.mjs
          node --check tools/product-experience-gate.mjs
          node --check tools/seo-smoke-test.mjs
          node --check tools/site-positioning-gate.mjs
          node --check tools/sync-site-navigation.mjs

      - name: Validate GSC monitoring script syntax
        run: python3 -c 'from pathlib import Path; compile(Path("tools/gsc-growth-snapshot.py").read_text(), "tools/gsc-growth-snapshot.py", "exec")'

      - name: Validate private export reporting
        run: python3 tools/growth-weekly-report-test.py

      - name: Validate structured editorial data
        run: |
          jq empty data/editorial-evidence.json
          jq empty data/affiliate-offers/*.json
          jq empty data/content-brief.schema.json
          jq empty data/kinderwagen-guides.v0.1.json
          jq empty data/kinderwagen-navigator/media.schema.json
          jq empty data/kinderwagen-navigator/media.v0.1.json
          jq empty data/kinderwagen-navigator/release-readiness.v0.1.json
          jq empty data/kinderwagen-navigator/tracking-contract.v0.1.json
          jq empty data/product-experience/*.json
          jq empty data/spielzeug-siegel.json
          jq empty data/seo-monitoring-config.json
          jq empty content-briefs/*.json

      - name: Validate AI publishing inputs and generated assets
        run: |
          node tools/analytics-contract-gate.mjs
          node tools/kpi-dashboard/validate.cjs
          node tools/build-kinderwagen-guides.mjs --check
          node tools/babywalz-price-snapshot-test.mjs
          node tools/awin-article-offer-gate.mjs
          node tools/affiliate-integrity-check.mjs --strict
          node tools/babywalz-feed-health.mjs
          # Als eigene strukturelle Prüfung vor dem zusammengefassten Beta-Gate.
          # Zeitkritische Datenfrische läuft in einem getrennten CI-Job.
          node tools/kinderwagen-kennzahlen-gate.mjs
          node tools/content-brief-gate.mjs
          node tools/generate-seal-assets.mjs --check
          node tools/kinderwagen-media-rights-gate.mjs
          node tools/kinderwagen-beta-gate.mjs
          node tools/product-experience-gate.mjs
          node tools/site-positioning-gate.mjs
          node tools/ki-bildkennzeichnung-gate.mjs
          node tools/sync-site-navigation.mjs --check

      - name: Run local SEO smoke test
        run: |
          node tools/seo-smoke-test.mjs --local
          node tools/internal-link-audit.mjs

  kinderwagen-freshness:
    name: Kinderwagen data freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate machine-readable stale report
        run: node tools/kinderwagen-data-freshness-gate.mjs --report="${RUNNER_TEMP}/kinderwagen-stale-report.json"

      - name: Upload stale report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinderwagen-stale-report-${{ github.run_id }}
          path: ${{ runner.temp }}/kinderwagen-stale-report.json
          if-no-files-found: error
          retention-days: 30

  live-quality:
    name: Daily production smoke test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: local-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate production routes and redirects
        run: node tools/seo-smoke-test.mjs --base-url=https://kleinkind-welt.de

      - name: Confirm noindex header for internal docs
        run: |
          curl --fail --silent --show-error --head https://kleinkind-welt.de/docs/integrations/brevo-doi-template.html | grep -i "^x-robots-tag: noindex, nofollow"
